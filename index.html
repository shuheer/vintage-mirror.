<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vintage Mirror</title>
<style>
  :root {
    color-scheme: dark;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    height: 100%;
    width: 100%;
    margin: 0;
    overflow: hidden;
    background: #140c08;
    font-family: Georgia, "Times New Roman", serif;
    color: #f3e3b8;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  /* =========================================================================
     1. LUXURY VANITY BACKGROUND: DRAPED ANTIQUE VELVET CURTAINS
     ========================================================================= */
  .curtain {
    position: absolute;
    inset: 0;
    background-color: #1b0f0b;
    background-image:
      /* Warm ambient candlelight glow from lower right */
      radial-gradient(ellipse 68% 58% at 86% 74%, rgba(255, 182, 76, 0.34) 0%, rgba(210, 118, 36, 0.14) 38%, rgba(0, 0, 0, 0) 72%),
      /* Soft top-center gallery spotlight */
      radial-gradient(ellipse 54% 46% at 50% 34%, rgba(220, 170, 98, 0.22) 0%, rgba(0, 0, 0, 0) 68%),
      /* Deep vertical velvet curtain folds */
      repeating-linear-gradient(
        90deg,
        #120907 0px,
        #2b1611 18px,
        #4a281d 34px,
        #321a13 52px,
        #150a08 72px,
        #3b1f17 94px,
        #532e20 112px,
        #28140f 134px,
        #120907 156px
      ),
      /* Subtle secondary velvet sheen */
      repeating-linear-gradient(
        89.2deg,
        rgba(255, 220, 170, 0.04) 0px,
        rgba(0, 0, 0, 0.25) 24px,
        rgba(255, 200, 140, 0.05) 48px,
        rgba(0, 0, 0, 0.3) 78px
      );
    background-blend-mode: screen, screen, normal, multiply;
  }
  .curtain::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 76% 66% at 50% 42%, rgba(0, 0, 0, 0) 35%, rgba(6, 3, 2, 0.84) 100%),
      linear-gradient(180deg, rgba(8, 4, 2, 0.65) 0%, rgba(0, 0, 0, 0) 20%, rgba(0, 0, 0, 0.35) 85%, rgba(0, 0, 0, 0.86) 100%);
    pointer-events: none;
  }

  /* =========================================================================
     2. POLISHED DARK MAHOGANY VANITY TABLE & CONTACT SHADOW
     ========================================================================= */
  .table {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 16%;
    z-index: 1;
    background-color: #2c1509;
    background-image:
      radial-gradient(ellipse 42% 85% at 88% 22%, rgba(255, 195, 105, 0.28) 0%, rgba(190, 110, 42, 0.1) 45%, rgba(0, 0, 0, 0) 75%),
      radial-gradient(ellipse 36% 60% at 50% 18%, rgba(240, 198, 128, 0.14) 0%, rgba(0, 0, 0, 0) 70%),
      repeating-linear-gradient(
        180deg,
        rgba(0, 0, 0, 0) 0px,
        rgba(20, 7, 2, 0.18) 2px,
        rgba(255, 185, 110, 0.04) 4px,
        rgba(0, 0, 0, 0) 8px
      ),
      repeating-linear-gradient(
        91deg,
        rgba(0, 0, 0, 0) 0px,
        rgba(12, 4, 1, 0.22) 14px,
        rgba(255, 190, 120, 0.04) 26px,
        rgba(0, 0, 0, 0) 44px
      ),
      linear-gradient(180deg, #6b391b 0%, #4e2610 18%, #341709 56%, #1b0b04 100%);
    box-shadow:
      inset 0 2px 0 rgba(255, 212, 148, 0.34),
      inset 0 10px 22px rgba(0, 0, 0, 0.55),
      0 -6px 24px rgba(0, 0, 0, 0.72);
  }

  .table-mirror-shadow {
    position: absolute;
    left: 50%;
    bottom: 7.4%;
    transform: translateX(-50%);
    width: min(46vh, 84vw);
    height: 4.5%;
    z-index: 1;
    border-radius: 50%;
    background: radial-gradient(ellipse at 50% 50%, rgba(0, 0, 0, 0.9) 0%, rgba(0, 0, 0, 0.55) 48%, rgba(0, 0, 0, 0) 76%);
    pointer-events: none;
  }

  /* =========================================================================
     3. ANTIQUE SERIF TITLE
     ========================================================================= */
  h1 {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 10px);
    left: 0;
    right: 0;
    text-align: center;
    margin: 0;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(22px, 5.4vw, 34px);
    letter-spacing: 0.05em;
    color: #f4d482;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.92), 0 0 24px rgba(244, 212, 130, 0.22);
    z-index: 4;
    pointer-events: none;
  }

  /* =========================================================================
     4. PURE CSS GLOWING BEESWAX CANDLE IN TURNED-BRASS DISH (ZERO SVG)
     ========================================================================= */
  .candle {
    position: absolute;
    right: clamp(12px, 5vw, 48px);
    bottom: 9.6%;
    width: clamp(48px, 11vw, 72px);
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 2;
    pointer-events: none;
  }
  .candle-halo {
    position: absolute;
    top: -42px;
    left: 50%;
    width: 170px;
    height: 170px;
    transform: translateX(-50%);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 206, 110, 0.45) 0%, rgba(255, 148, 46, 0.18) 36%, rgba(255, 110, 20, 0) 70%);
    animation: haloPulse 1.7s infinite alternate ease-in-out;
  }
  .flame {
    position: relative;
    width: 15px;
    height: 30px;
    margin-bottom: -3px;
    border-radius: 50% 50% 50% 50% / 68% 68% 32% 32%;
    background: radial-gradient(ellipse at 50% 68%, #fffef2 0%, #ffe073 36%, #ff8e1c 74%, rgba(255, 95, 0, 0) 100%);
    box-shadow: 0 0 26px 8px rgba(255, 178, 66, 0.55);
    transform-origin: 50% 90%;
    animation: flicker 1.35s infinite alternate ease-in-out;
    z-index: 3;
  }
  .flame::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 4px;
    width: 7px;
    height: 13px;
    transform: translateX(-50%);
    border-radius: 50% 50% 50% 50% / 65% 65% 35% 35%;
    background: radial-gradient(ellipse at 50% 78%, rgba(92, 200, 255, 0.85) 0%, #ffffff 55%, rgba(255, 255, 230, 0) 100%);
  }
  .wick {
    width: 2px;
    height: 7px;
    background: #23160b;
    border-radius: 2px;
    margin-bottom: -2px;
    z-index: 2;
  }
  .wax {
    position: relative;
    width: 24px;
    height: 68px;
    border-radius: 4px 4px 3px 3px;
    background:
      linear-gradient(180deg, rgba(255, 185, 76, 0.34) 0%, rgba(255, 185, 76, 0) 38%),
      linear-gradient(90deg, #b8a787 0%, #fff8e6 32%, #ece0c2 68%, #8f7e60 100%);
    box-shadow: inset 0 3px 4px rgba(255, 245, 212, 0.9), 0 2px 6px rgba(0, 0, 0, 0.55);
    z-index: 1;
  }
  .wax::before {
    content: "";
    position: absolute;
    top: 2px;
    left: 3px;
    width: 4px;
    height: 22px;
    border-radius: 0 0 4px 4px;
    background: linear-gradient(180deg, #fff5d8, #e6d5b2);
    opacity: 0.9;
  }
  .wax::after {
    content: "";
    position: absolute;
    top: 2px;
    right: 4px;
    width: 4px;
    height: 30px;
    border-radius: 0 0 4px 4px;
    background: linear-gradient(180deg, #f7ebd0, #d8c6a1);
    opacity: 0.85;
  }
  .brass-cup {
    width: 30px;
    height: 11px;
    margin-top: -2px;
    border-radius: 3px 3px 6px 6px;
    background: linear-gradient(90deg, #4b2f08 0%, #d8a540 26%, #fff1b0 48%, #a6721e 74%, #3c2205 100%);
    border: 1px solid #2b1803;
    z-index: 2;
  }
  .brass-dish {
    position: relative;
    width: 58px;
    height: 13px;
    margin-top: -4px;
    border-radius: 50%;
    background: linear-gradient(90deg, #472c07 0%, #d5a23e 24%, #ffefb0 48%, #a3701d 76%, #392104 100%);
    border: 1px solid #2a1703;
    box-shadow: 0 5px 12px rgba(0, 0, 0, 0.88), inset 0 2px 3px rgba(255, 244, 198, 0.5);
    z-index: 1;
  }
  .brass-dish::after {
    content: "";
    position: absolute;
    right: -10px;
    top: 1px;
    width: 12px;
    height: 9px;
    border: 3px solid #c99634;
    border-left: none;
    border-radius: 0 9px 9px 0;
  }

  @keyframes flicker {
    0%   { transform: scale(0.96, 1.03) rotate(-1.6deg); opacity: 0.95; }
    40%  { transform: scale(1.05, 0.95) rotate(1.5deg); opacity: 1; }
    75%  { transform: scale(0.98, 1.04) rotate(-0.9deg); opacity: 0.94; }
    100% { transform: scale(1.04, 0.96) rotate(1.8deg); opacity: 0.99; }
  }
  @keyframes haloPulse {
    from { opacity: 0.82; transform: translateX(-50%) scale(0.95); }
    to   { opacity: 1; transform: translateX(-50%) scale(1.07); }
  }

  /* =========================================================================
     5. CENTERED ORNATE MIRROR ASSEMBLY (900x1440 ASPECT RATIO)
     ========================================================================= */
  .wrap {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: 7%;
    height: min(84vh, 152vw);
    aspect-ratio: 900 / 1440;
    z-index: 3;
  }
  .wrap > * { position: absolute; }

  /* Exact inner oval matching #frameCanvas transparent cutout (cx=450, cy=652.5, rx=272.25, ry=425.25) */
  .cam {
    left: 19.75%;
    top: 15.78%;
    width: 60.5%;
    height: 59.06%;
    border-radius: 50%;
    overflow: hidden;
    background:
      radial-gradient(ellipse at 32% 24%, rgba(215, 178, 118, 0.22), rgba(0, 0, 0, 0) 50%),
      linear-gradient(120deg, #17110b 0%, #2e2318 45%, #1c150e 72%, #0e0a07 100%);
  }

  /* RAW horizontally mirrored camera video — zero filters, zero distortion */
  video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
    display: none;
  }

  /* Edge-only recessed rim shadow so glass feels seated inside the frame without touching the face */
  .bevel-shadow {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    box-shadow:
      inset 0 0 14px 3px rgba(14, 8, 3, 0.72),
      inset 0 2px 6px 1px rgba(0, 0, 0, 0.6);
    pointer-events: none;
    z-index: 2;
  }

  #flash {
    position: absolute;
    inset: 0;
    background: #ffffff;
    opacity: 0;
    transition: opacity 0.3s ease-out;
    z-index: 3;
    pointer-events: none;
  }
  #flash.on {
    opacity: 0.92;
    transition: none;
  }

  /* Initial camera prompt inside mirror */
  .msg {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    text-align: center;
    padding: 16%;
    font-size: clamp(14px, 3.6vw, 16px);
    line-height: 1.45;
    font-style: italic;
    color: #ecdab0;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.85);
    z-index: 4;
  }
  button#go {
    font: inherit;
    font-style: normal;
    font-size: clamp(14px, 3.8vw, 16px);
    letter-spacing: 0.03em;
    padding: 11px 24px;
    border-radius: 999px;
    border: 1.5px solid #593a0c;
    background: linear-gradient(180deg, #fce39a 0%, #d49c34 55%, #9f6d18 100%);
    color: #241403;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 250, 220, 0.75);
    transition: transform 0.12s ease, filter 0.15s ease;
  }
  button#go:hover { filter: brightness(1.08); }
  button#go:active { transform: scale(0.96); }
  button#go:focus-visible { outline: 3px solid #fff3c4; outline-offset: 3px; }

  /* Pure HTML5 2D Canvas Baroque Mirror Frame Overlay */
  #frameCanvas {
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 5;
  }

  /* Accessible Transparent Shutter Button positioned over the bottom sapphire gem (450, 1120.5) */
  #shutter {
    left: 50%;
    top: 77.8125%;
    width: 17%;
    height: 11.5%;
    transform: translate(-50%, -50%);
    border: none;
    background: transparent;
    padding: 0;
    margin: 0;
    border-radius: 50%;
    cursor: pointer;
    z-index: 6;
    display: flex;
    align-items: center;
    justify-content: center;
    outline: none;
  }
  #shutter::before {
    content: "";
    width: 56%;
    height: 68%;
    border-radius: 50%;
    border: 2px solid rgba(122, 216, 255, 0.9);
    box-shadow: 0 0 10px rgba(80, 195, 255, 0.55);
    animation: gemPulse 2.2s ease-out infinite;
    pointer-events: none;
  }
  #shutter:active::before {
    border-color: #ffffff;
    box-shadow: 0 0 16px #ffffff;
  }
  #shutter:focus-visible {
    outline: 3px solid #ffffff;
    outline-offset: 2px;
  }

  @keyframes gemPulse {
    from { transform: scale(0.82); opacity: 0.92; }
    to   { transform: scale(1.85); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .flame, .candle-halo, #shutter::before { animation: none; }
  }
</style>
</head>
<body>

  <!-- Luxury Vanity Scene -->
  <div class="curtain" aria-hidden="true"></div>
  <div class="table" aria-hidden="true"></div>
  <div class="table-mirror-shadow" aria-hidden="true"></div>

  <!-- Glowing Beeswax Candle in Turned-Brass Dish -->
  <div class="candle" aria-hidden="true">
    <div class="candle-halo"></div>
    <div class="flame"></div>
    <div class="wick"></div>
    <div class="wax"></div>
    <div class="brass-cup"></div>
    <div class="brass-dish"></div>
  </div>

  <!-- Title -->
  <h1>Vintage Mirror</h1>

  <!-- Ornate Baroque Mirror Assembly -->
  <div class="wrap" id="wrap">
    <!-- Live Raw Mirrored Camera Viewport -->
    <div class="cam">
      <video id="v" autoplay playsinline muted></video>
      <div class="bevel-shadow" aria-hidden="true"></div>
      <div class="msg" id="msg">
        <span>Step up and take a look.</span>
        <button id="go" type="button">Open mirror</button>
      </div>
      <div id="flash" aria-hidden="true"></div>
    </div>

    <!-- Single Pre-Rendered Pure 2D Canvas Baroque Gold Mirror Frame (900x1440) -->
    <canvas id="frameCanvas" width="900" height="1440" aria-hidden="true"></canvas>

    <!-- Transparent Accessible Shutter Button over Bottom Sapphire Gem -->
    <button id="shutter" type="button" aria-label="Save photo"></button>
  </div>

<script>
(function () {
  'use strict';

  /* =========================================================================
     CONSTANTS & SHARED CANVASES (FIXED 900x1440 FOR ZERO-CRASH PERFORMANCE)
     ========================================================================= */
  var W = 900;
  var H = 1440;
  var S = 2.25; // Scale from 400x640 design grid to 900x1440
  var CX = 200 * S; // 450
  var CY = 290 * S; // 652.5
  var INNER_RX = 121 * S; // 272.25
  var INNER_RY = 189 * S; // 425.25

  var frameCanvas = document.getElementById('frameCanvas');
  var fCtx = frameCanvas.getContext('2d');

  // Single reusable offscreen canvas for all captures (never reallocated)
  var captureCanvas = document.createElement('canvas');
  captureCanvas.width = W;
  captureCanvas.height = H;
  var capCtx = captureCanvas.getContext('2d');

  /* =========================================================================
     1. METALLIC ANTIQUE GOLD GRADIENT HELPERS
     ========================================================================= */
  function goldLinear(ctx, x1, y1, x2, y2) {
    var g = ctx.createLinearGradient(x1, y1, x2, y2);
    g.addColorStop(0.00, '#fff4be');
    g.addColorStop(0.18, '#e8bc52');
    g.addColorStop(0.38, '#9c6819');
    g.addColorStop(0.56, '#f8db82');
    g.addColorStop(0.76, '#7a4c0f');
    g.addColorStop(0.90, '#cfa03c');
    g.addColorStop(1.00, '#472a06');
    return g;
  }

  function goldTube(ctx, x1, y1, x2, y2) {
    var g = ctx.createLinearGradient(x1, y1, x2, y2);
    g.addColorStop(0.00, '#4a2b06');
    g.addColorStop(0.22, '#c89432');
    g.addColorStop(0.45, '#fff1ae');
    g.addColorStop(0.70, '#966416');
    g.addColorStop(0.88, '#d6a642');
    g.addColorStop(1.00, '#3b2104');
    return g;
  }

  function goldRoseGrad(ctx, r) {
    var g = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.08, 0, 0, r * 1.15);
    g.addColorStop(0.00, '#fff6c6');
    g.addColorStop(0.36, '#e4b243');
    g.addColorStop(0.74, '#8a5713');
    g.addColorStop(1.00, '#3b2104');
    return g;
  }

  /* =========================================================================
     2. BOTANICAL & BAROQUE ORNAMENT DRAWING PRIMITIVES (PURE 2D CANVAS)
     ========================================================================= */
  function drawAcanthusLeaf(ctx, x, y, rotDeg, sx, sy) {
    sy = (sy === undefined) ? sx : sy;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rotDeg * Math.PI / 180);
    ctx.scale(sx, sy);

    // Subtle cast shadow onto the gold rim
    ctx.save();
    ctx.translate(1.5, 3.2);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(16, -20, 36, -27, 56, -18);
    ctx.bezierCurveTo(66, -13, 77, -4, 90, 0);
    ctx.bezierCurveTo(77, 4, 66, 13, 56, 18);
    ctx.bezierCurveTo(36, 27, 16, 20, 0, 0);
    ctx.closePath();
    ctx.fillStyle = 'rgba(28, 14, 2, 0.42)';
    ctx.fill();
    ctx.restore();

    // Sculpted leaf body
    var lg = ctx.createLinearGradient(0, -18, 90, 18);
    lg.addColorStop(0.0, '#fff5c4');
    lg.addColorStop(0.35, '#e2b042');
    lg.addColorStop(0.74, '#875512');
    lg.addColorStop(1.0, '#462806');

    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(16, -20, 36, -27, 56, -18);
    ctx.bezierCurveTo(66, -13, 77, -4, 90, 0);
    ctx.bezierCurveTo(77, 4, 66, 13, 56, 18);
    ctx.bezierCurveTo(36, 27, 16, 20, 0, 0);
    ctx.closePath();
    ctx.fillStyle = lg;
    ctx.fill();
    ctx.lineWidth = 2.1;
    ctx.strokeStyle = '#361f04';
    ctx.stroke();

    // Raised specular ridges
    ctx.strokeStyle = 'rgba(255, 244, 192, 0.72)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(14, -10);
    ctx.quadraticCurveTo(38, -15, 62, -6);
    ctx.moveTo(14, 10);
    ctx.quadraticCurveTo(38, 15, 62, 6);
    ctx.stroke();

    // Central carved vein
    ctx.strokeStyle = 'rgba(54, 31, 4, 0.8)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(4, 0);
    ctx.lineTo(78, 0);
    ctx.stroke();

    ctx.restore();
  }

  function drawBaroqueRose(ctx, x, y, rotDeg, scale) {
    var r = 25.5 * scale;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rotDeg * Math.PI / 180);

    // Cast shadow
    ctx.beginPath();
    ctx.arc(2, 4, r * 1.04, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(24, 12, 2, 0.48)';
    ctx.fill();

    // Outer scalloped rosette petals (5 overlapping lobes)
    var baseGrad = goldRoseGrad(ctx, r);
    for (var i = 0; i < 5; i++) {
      var a = (i * 72) * Math.PI / 180;
      ctx.beginPath();
      ctx.arc(Math.cos(a) * r * 0.34, Math.sin(a) * r * 0.34, r * 0.68, 0, Math.PI * 2);
      ctx.fillStyle = baseGrad;
      ctx.fill();
      ctx.lineWidth = 1.8 * scale;
      ctx.strokeStyle = '#382105';
      ctx.stroke();
    }

    // Inner core dome
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.72, 0, Math.PI * 2);
    ctx.fillStyle = baseGrad;
    ctx.fill();
    ctx.lineWidth = 1.8 * scale;
    ctx.strokeStyle = '#382105';
    ctx.stroke();

    // Carved spiral petal folds
    ctx.strokeStyle = '#382105';
    ctx.lineWidth = 2.1 * scale;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.50, 0.4, Math.PI * 1.65);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(0, 0, r * 0.27, 2.2, Math.PI * 1.85 + 1.5);
    ctx.stroke();

    // Warm specular gold highlights on raised petal edges
    ctx.strokeStyle = 'rgba(255, 245, 198, 0.72)';
    ctx.lineWidth = 1.4 * scale;
    ctx.beginPath();
    ctx.arc(-r * 0.08, -r * 0.08, r * 0.48, Math.PI * 1.05, Math.PI * 1.55);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(-r * 0.14, -r * 0.14, r * 0.16, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 248, 212, 0.65)';
    ctx.fill();

    ctx.restore();
  }

  function drawBaroqueScroll(ctx, x, y, rotDeg, sx, sy) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rotDeg * Math.PI / 180);
    ctx.scale(sx, sy);

    ctx.lineCap = 'round';
    // Shadow
    ctx.save();
    ctx.translate(2, 4);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(27, -32, 72, -32, 86, -4);
    ctx.bezierCurveTo(95, 14, 76, 32, 58, 25);
    ctx.bezierCurveTo(45, 20, 45, 4, 56, 2);
    ctx.strokeStyle = 'rgba(24, 12, 2, 0.45)';
    ctx.lineWidth = 11;
    ctx.stroke();
    ctx.restore();

    // Dark bronze outline
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(27, -32, 72, -32, 86, -4);

  function drawSapphireGem(ctx, cx, cy, rx, ry) {
    ctx.save();
    ctx.translate(cx, cy);

    // Outer drop shadow
    ctx.beginPath();
    ctx.ellipse(2, 5, rx + 11, ry + 11, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(18, 9, 2, 0.55)';
    ctx.fill();

    // Ornate gold bezel setting
    ctx.beginPath();
    ctx.ellipse(0, 0, rx + 10, ry + 10, 0, 0, Math.PI * 2);
    ctx.fillStyle = goldLinear(ctx, -rx - 10, -ry - 10, rx + 10, ry + 10);
    ctx.fill();
    ctx.lineWidth = 3.2;
    ctx.strokeStyle = '#361f04';
    ctx.stroke();

    // Recessed inner bezel rim
    ctx.beginPath();
    ctx.ellipse(0, 0, rx + 2.5, ry + 2.5, 0, 0, Math.PI * 2);
    ctx.strokeStyle = '#fff1b3';
    ctx.lineWidth = 1.6;
    ctx.stroke();

    // Royal blue sapphire cabochon body
    var sg = ctx.createRadialGradient(-rx * 0.28, -ry * 0.30, rx * 0.08, 0, 0, Math.max(rx, ry) * 1.12);
    sg.addColorStop(0.00, '#a6ecff');
    sg.addColorStop(0.22, '#2a9ee8');
    sg.addColorStop(0.56, '#0b4a9c');
    sg.addColorStop(0.86, '#051f54');
    sg.addColorStop(1.00, '#020b24');

    ctx.beginPath();
    ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
    ctx.fillStyle = sg;
    ctx.fill();
    ctx.lineWidth = 1.8;
    ctx.strokeStyle = '#bceeff';
    ctx.stroke();

    // Faceted gemstone table polygon
    var fg = ctx.createLinearGradient(-rx * 0.6, -ry * 0.7, rx * 0.6, ry * 0.7);
    fg.addColorStop(0.0, 'rgba(255, 255, 255, 0.68)');
    fg.addColorStop(0.42, 'rgba(110, 214, 255, 0.22)');
    fg.addColorStop(1.0, 'rgba(3, 22, 62, 0.45)');
    ctx.beginPath();
    ctx.moveTo(0, -ry * 0.78);
    ctx.lineTo(rx * 0.58, -ry * 0.32);
    ctx.lineTo(rx * 0.48, ry * 0.38);
    ctx.lineTo(0, ry * 0.76);
    ctx.lineTo(-rx * 0.48, ry * 0.38);
    ctx.lineTo(-rx * 0.58, -ry * 0.32);
    ctx.closePath();
    ctx.fillStyle = fg;
    ctx.fill();

    // Crisp white specular glint
    ctx.save();
    ctx.translate(-rx * 0.34, -ry * 0.36);
    ctx.rotate(-0.26);
    ctx.beginPath();
    ctx.ellipse(0, 0, rx * 0.26, ry * 0.28, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.84)';
    ctx.fill();
    ctx.restore();

    // Subtle lower internal blue bounce light
    ctx.beginPath();
    ctx.ellipse(rx * 0.16, ry * 0.46, rx * 0.32, ry * 0.15, -0.2, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(90, 212, 255, 0.42)';
    ctx.fill();

    // 4 sculpted gold bezel prongs
    var prongOffsets = [
      [-rx * 0.82, -ry * 0.68],
      [ rx * 0.82, -ry * 0.68],
      [-rx * 0.82,  ry * 0.68],
      [ rx * 0.82,  ry * 0.68]
    ];
    for (var p = 0; p < prongOffsets.length; p++) {
      ctx.beginPath();
      ctx.arc(prongOffsets[p][0], prongOffsets[p][1], 4.2, 0, Math.PI * 2);
      ctx.fillStyle = '#fff2b8';
      ctx.fill();
      ctx.lineWidth = 1.4;
      ctx.strokeStyle = '#361f04';
      ctx.stroke();
    }

    ctx.restore();
  }

  function drawBeadRing(ctx, cx, cy, rx, ry, count, beadRadius) {
    for (var i = 0; i < count; i++) {
      var t = (i / count) * Math.PI * 2;
      var bx = cx + rx * Math.cos(t);
      var by = cy + ry * Math.sin(t);
      var bg = ctx.createRadialGradient(bx - beadRadius * 0.35, by - beadRadius * 0.35, beadRadius * 0.1, bx, by, beadRadius);
      bg.addColorStop(0.0, '#fff6c6');
      bg.addColorStop(0.45, '#dfb042');
      bg.addColorStop(1.0, '#4d2e07');
      ctx.beginPath();
      ctx.arc(bx, by, beadRadius, 0, Math.PI * 2);
      ctx.fillStyle = bg;
      ctx.fill();
      ctx.lineWidth = 0.8;
      ctx.strokeStyle = 'rgba(42, 23, 4, 0.72)';
      ctx.stroke();
    }
  }

  function drawHangingChainAndBell(ctx, sx, sy, len) {
    // Beaded gold chain links
    var step = 7.5;
    for (var dy = 0; dy <= len; dy += step) {
      var bx = sx;
      var by = sy + dy;
      ctx.beginPath();
      ctx.arc(bx, by, 2.7, 0, Math.PI * 2);
      ctx.fillStyle = '#e7ba50';
      ctx.fill();
      ctx.lineWidth = 0.9;
      ctx.strokeStyle = '#3a2205';
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(bx - 0.8, by - 0.8, 0.9, 0, Math.PI * 2);
      ctx.fillStyle = '#fff7cc';
      ctx.fill();
    }

    // Miniature turned-brass bell
    var bellTop = sy + len;
    ctx.save();
    // Cast shadow
    ctx.beginPath();
    ctx.ellipse(sx + 2, bellTop + 29, 19, 5, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(18, 9, 2, 0.42)';
    ctx.fill();

    // Flared bell body
    ctx.beginPath();
    ctx.moveTo(sx - 4.5, bellTop);
    ctx.bezierCurveTo(sx - 13.5, bellTop + 4.5, sx - 17, bellTop + 20, sx - 19.5, bellTop + 26);
    ctx.lineTo(sx + 19.5, bellTop + 26);
    ctx.bezierCurveTo(sx + 17, bellTop + 20, sx + 13.5, bellTop + 4.5, sx + 4.5, bellTop);
    ctx.closePath();
    ctx.fillStyle = goldTube(ctx, sx - 19, bellTop, sx + 19, bellTop);
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#382205';
    ctx.stroke();

    // Bell rim
    ctx.beginPath();
    ctx.ellipse(sx, bellTop + 26, 19.5, 4.8, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#f6d87d';
    ctx.fill();
    ctx.lineWidth = 1.6;
    ctx.strokeStyle = '#382205';
    ctx.stroke();

    // Brass clapper bead
    ctx.beginPath();
    ctx.arc(sx, bellTop + 30.5, 4.6, 0, Math.PI * 2);
    ctx.fillStyle = goldLinear(ctx, sx - 5, bellTop + 26, sx + 5, bellTop + 35);
    ctx.fill();
    ctx.lineWidth = 1.4;
    ctx.strokeStyle = '#382205';
    ctx.stroke();

    // Specular glint on bell shoulder
    ctx.beginPath();
    ctx.ellipse(sx - 5.5, bellTop + 12, 3.2, 5.5, 0.25, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 250, 218, 0.78)';
    ctx.fill();
    ctx.restore();
  }

     3. RENDER COMPLETE BAROQUE GOLD MIRROR FRAME ONCE ONTO #frameCanvas

  function renderMirrorFrame() {
    var ctx = fCtx;
    ctx.clearRect(0, 0, W, H);

    ctx.save();
    ctx.lineJoin = 'round';

    ctx.beginPath();

    ctx.bezierCurveTo(308 * S, 522 * S, 366 * S, 426 * S, 346 * S, 294 * S);
    ctx.strokeStyle = '#361f04';

    // Engraved yoke center beading line
    ctx.save();

    ctx.lineWidth = 2.4;

    ctx.stroke();

    // Stem vertical flutes
    ctx.lineWidth = 2.2;
    ctx.strokeStyle = 'rgba(54, 31, 4, 0.58)';
    ctx.beginPath();
    ctx.moveTo(194 * S, 510 * S); ctx.lineTo(196 * S, 562 * S);
    ctx.moveTo(206 * S, 510 * S); ctx.lineTo(204 * S, 562 * S);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255, 245, 198, 0.65)';
    ctx.beginPath();
    ctx.moveTo(200 * S, 510 * S); ctx.lineTo(200 * S, 562 * S);
    ctx.stroke();

    // Turned brass collars
    ctx.beginPath();
    ctx.ellipse(CX, 542 * S, 19 * S, 6.5 * S, 0, 0, Math.PI * 2);

    ctx.strokeStyle = '#361f04';

    ctx.beginPath();
    ctx.ellipse(CX, 562 * S, 24 * S, 7 * S, 0, 0, Math.PI * 2);

    ctx.fill();
    ctx.stroke();

    // Cabriole pedestal feet
    ctx.beginPath();
    ctx.moveTo(104 * S, 619 * S);
    ctx.bezierCurveTo(96 * S, 625 * S, 98 * S, 633 * S, 110 * S, 633 * S);
    ctx.bezierCurveTo(118 * S, 633 * S, 124 * S, 628 * S, 126 * S, 624 * S);
    ctx.fillStyle = goldTube(ctx, 96 * S, 626 * S, 126 * S, 626 * S);
    ctx.fill();
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(296 * S, 619 * S);
    ctx.bezierCurveTo(304 * S, 625 * S, 302 * S, 633 * S, 290 * S, 633 * S);
    ctx.bezierCurveTo(282 * S, 633 * S, 276 * S, 628 * S, 274 * S, 624 * S);
    ctx.fillStyle = goldTube(ctx, 274 * S, 626 * S, 304 * S, 626 * S);
    ctx.fill();
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(186 * S, 628 * S);
    ctx.quadraticCurveTo(200 * S, 637 * S, 214 * S, 628 * S);
    ctx.fillStyle = goldTube(ctx, 186 * S, 630 * S, 214 * S, 630 * S);
    ctx.fill();
    ctx.stroke();

    // Main scalloped baroque pedestal body
    ctx.beginPath();
    ctx.moveTo(148 * S, 594 * S);
    ctx.bezierCurveTo(150 * S, 572 * S, 174 * S, 562 * S, 200 * S, 562 * S);
    ctx.bezierCurveTo(226 * S, 562 * S, 250 * S, 572 * S, 252 * S, 594 * S);
    ctx.bezierCurveTo(266 * S, 599 * S, 294 * S, 602 * S, 302 * S, 620 * S);
    ctx.bezierCurveTo(298 * S, 627 * S, 284 * S, 630 * S, 272 * S, 628 * S);
    ctx.bezierCurveTo(252 * S, 634 * S, 148 * S, 634 * S, 128 * S, 628 * S);
    ctx.bezierCurveTo(116 * S, 630 * S, 102 * S, 627 * S, 98 * S, 620 * S);
    ctx.bezierCurveTo(106 * S, 602 * S, 134 * S, 599 * S, 148 * S, 594 * S);
    ctx.closePath();
    ctx.fillStyle = goldLinear(ctx, 98 * S, 562 * S, 302 * S, 634 * S);
    ctx.fill();
    ctx.lineWidth = 3.2;
    ctx.strokeStyle = '#361f04';
    ctx.stroke();
    ctx.restore();

    // Pedestal specular molding highlight
    ctx.beginPath();
    ctx.moveTo(118 * S, 614 * S);
    ctx.bezierCurveTo(154 * S, 623 * S, 246 * S, 623 * S, 282 * S, 614 * S);
    ctx.strokeStyle = 'rgba(255, 244, 194, 0.68)';
    ctx.lineWidth = 2.6;

    // Pedestal botanical ornaments
    drawAcanthusLeaf(ctx, 176 * S, 606 * S, 174, 0.78);
    drawAcanthusLeaf(ctx, 224 * S, 606 * S, 6, 0.78);
    var baseRoses = [
      [158, 598, 0.72], [200, 604, 0.84], [242, 598, 0.72],
      [128, 616, 0.65], [272, 616, 0.65]
    ];
    for (var br = 0; br < baseRoses.length; br++) {
      drawBaroqueRose(ctx, baseRoses[br][0] * S, baseRoses[br][1] * S, 0, baseRoses[br][2]);
    }

    // --- C. HANGING GOLD BEADED CHAINS & BRASS BELLS ---
    var chainSpecs = [[-62, 36], [-34, 54], [34, 54], [62, 36]];
    for (var ci = 0; ci < chainSpecs.length; ci++) {
      var ang = (90 + chainSpecs[ci][0]) * Math.PI / 180;
      var chX = CX + (151 * S) * Math.cos(ang) * 0.985;
      var chY = CY + (213 * S) * Math.sin(ang) * 0.985;
      drawHangingChainAndBell(ctx, chX, chY, (chainSpecs[ci][1] + 8) * S);
    }

    // --- D. MAIN BAROQUE OVAL FRAME BODY (TRANSPARENT INNER OVAL VIA EVENODD) ---
    ctx.save();
    ctx.shadowColor = 'rgba(0, 0, 0, 0.62)';
    ctx.shadowBlur = 18;
    ctx.shadowOffsetY = 10;

    ctx.beginPath();
    ctx.ellipse(CX, CY, 154 * S, 218 * S, 0, 0, Math.PI * 2);
    ctx.ellipse(CX, CY, INNER_RX, INNER_RY, 0, 0, Math.PI * 2);
    ctx.fillStyle = goldLinear(ctx, CX - 154 * S, CY - 218 * S, CX + 154 * S, CY + 218 * S);
    ctx.fill('evenodd');
    ctx.restore();

    // Outer sculpted dark bronze outline
    ctx.beginPath();
    ctx.ellipse(CX, CY, 154 * S, 218 * S, 0, 0, Math.PI * 2);
    ctx.lineWidth = 3.5;
    ctx.strokeStyle = '#361f04';
    ctx.stroke();

    // Recessed antique bronze channel along mid-frame
    var chGrad = ctx.createLinearGradient(CX - 140 * S, CY - 205 * S, CX + 140 * S, CY + 205 * S);
    chGrad.addColorStop(0.00, '#5a3609');
    chGrad.addColorStop(0.30, '#c89635');
    chGrad.addColorStop(0.55, '#3e2304');
    chGrad.addColorStop(0.80, '#e2b551');
    chGrad.addColorStop(1.00, '#2a1603');
    ctx.beginPath();
    ctx.ellipse(CX, CY, 137 * S, 203 * S, 0, 0, Math.PI * 2);

    ctx.strokeStyle = chGrad;

    // Top baroque filigree crest silhouette
    ctx.beginPath();
    ctx.moveTo(200 * S, 42 * S);
    ctx.bezierCurveTo(182 * S, 57 * S, 164 * S, 66 * S, 142 * S, 74 * S);
    ctx.bezierCurveTo(166 * S, 78 * S, 182 * S, 88 * S, 200 * S, 94 * S);
    ctx.bezierCurveTo(218 * S, 88 * S, 234 * S, 78 * S, 258 * S, 74 * S);

      var oy = CY + (214 * S) * Math.sin(rad2);
      var outDeg = Math.atan2(214 * Math.sin(rad2), 149 * Math.cos(rad2)) * 180 / Math.PI;

    }

    // Main ring of acanthus leaves and roses (denser & larger at top/bottom)
    for (var d = 0; d < 360; d += 10) {
      var rad = d * Math.PI / 180;
      var rx = CX + (137 * S) * Math.cos(rad);
      var ry = CY + (203 * S) * Math.sin(rad);
      var tanDeg = Math.atan2(203 * Math.cos(rad), -137 * Math.sin(rad)) * 180 / Math.PI;
      var nearPole = Math.abs(Math.sin(rad));
      var sc = 0.56 + 0.54 * nearPole * nearPole;

        drawBaroqueRose(ctx, rx, ry, tanDeg, 0.52 + 0.58 * nearPole * nearPole);
      } else {
        drawAcanthusLeaf(ctx, rx, ry, tanDeg + (d % 20 ? -24 : 24), sc * 0.74);
      }
    }

    // Top crown baroque scrolls, fan leaves & flanking roses
    drawBaroqueScroll(ctx, 194 * S, 72 * S, -165, 0.85, 0.85);
    drawBaroqueScroll(ctx, 206 * S, 72 * S, -15, -0.85, 0.85);
    var topFan = [-64, -44, -22, 0, 22, 44, 64];
    for (var tf = 0; tf < topFan.length; tf++) {

      drawAcanthusLeaf(ctx, CX, 90 * S, -90 + aTop, 1.22 - Math.abs(aTop) / 115);

    drawBaroqueRose(ctx, (200 - 48 * 1.12) * S, 98 * S, 0, 0.94);
    drawBaroqueRose(ctx, (200 + 48 * 1.12) * S, 98 * S, 0, 0.94);

    // Bottom filigree cluster around shutter sapphire
    drawBaroqueScroll(ctx, 192 * S, 502 * S, 162, 0.75, -0.75);
    drawBaroqueScroll(ctx, 208 * S, 502 * S, 18, -0.75, -0.75);
    var botFan = [-62, -32, 32, 62];
    for (var bf = 0; bf < botFan.length; bf++) {
      drawAcanthusLeaf(ctx, CX, 492 * S, 90 + botFan[bf], 1.0);

    drawBaroqueRose(ctx, (200 - 36 * 1.24) * S, 496 * S, 0, 0.88);
    drawBaroqueRose(ctx, (200 + 36 * 1.24) * S, 496 * S, 0, 0.88);

    // --- F. GUARANTEE 100% TRANSPARENT INNER OVAL + CRISP RECESSED BEVEL ---
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.ellipse(CX, CY, INNER_RX - 0.5, INNER_RY - 0.5, 0, 0, Math.PI * 2);

    // Dark bronze recessed bevel & bright inner gold lip

    ctx.strokeStyle = 'rgba(255, 240, 179, 0.9)';
    ctx.stroke();

    // --- G. FACETED ROYAL BLUE SAPPHIRE GEMS (TOP CROWN & BOTTOM SHUTTER) ---
    drawSapphireGem(ctx, CX, 82 * S, 22.5, 32.5);
    drawSapphireGem(ctx, CX, 498 * S, 26.5, 37.5);

    ctx.restore();
  }

  /* =========================================================================
     4. DRAW FULL LUXURY SCENE BACKGROUND + CANDLE ON OFFSCREEN CAPTURE CANVAS
     ========================================================================= */
  function drawCaptureSceneBackground(ctx) {
    // 1. Draped antique velvet curtains
    ctx.fillStyle = '#1a0e0a';
    ctx.fillRect(0, 0, W, H);

    var foldStep = 3;
    for (var fx = 0; fx < W; fx += foldStep) {
      var w1 = Math.sin(fx * 0.056) * 0.5 + 0.5;
      var w2 = Math.sin(fx * 0.132 + 1.2) * 0.5 + 0.5;
      var v = w1 * 0.68 + w2 * 0.32;
      var r = Math.round(18 + v * 64);
      var g = Math.round(9 + v * 34);
      var b = Math.round(7 + v * 24);
      ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
      ctx.fillRect(fx, 0, foldStep + 1, H);
    }

    // Soft top-center gallery spotlight
    var spot = ctx.createRadialGradient(W * 0.5, H * 0.34, 36, W * 0.5, H * 0.38, W * 0.72);
    spot.addColorStop(0, 'rgba(225, 175, 105, 0.24)');
    spot.addColorStop(0.55, 'rgba(130, 82, 42, 0.08)');

  function drawCaptureCandle(ctx, cx, dishY) {

  /* =========================================================================

  var video = document.getElementById('v');

  async function startCam() {

  /* =========================================================================
     6. DIRECT SAVE TO DEVICE (iOS SHARE SHEET OR DOWNLOAD, NO PREVIEW MODAL)
     ========================================================================= */
  function saveShot(blob) {
    if (!blob) return;
    try {
      var now = new Date();
      var pad = function (n) { return String(n).padStart(2, '0'); };
      var filename = 'vintage-mirror-' +
        now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate()) + '-' +
        pad(now.getHours()) + pad(now.getMinutes()) + pad(now.getSeconds()) + '.jpg';

      var file = new File([blob], filename, { type: 'image/jpeg' });
      if (/iP(hone|ad|od)/.test(navigator.userAgent) && navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file] }).catch(function () {});
        return;
      }

      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 3000);
    } catch (err) {
      // Fail gracefully without crashing the renderer
    }
  }

  /* =========================================================================
     7. CRASH-PROOF FULL-SCENE SNAP (CANVAS-TO-CANVAS COMPOSITE)
     ========================================================================= */
  var isSnapping = false;

  function snap() {
    if (!video.srcObject) {
      startCam();
      return;
    }
    var vw = video.videoWidth;
    var vh = video.videoHeight;
    if (!vw || !vh || isSnapping) return;

    isSnapping = true;

    // Brief white shutter flash inside the mirror oval
    flash.classList.add('on');
    setTimeout(function () { flash.classList.remove('on'); }, 70);

    try {
      capCtx.clearRect(0, 0, W, H);
      capCtx.imageSmoothingEnabled = true;

      // Layer 1: Draped velvet curtains, mahogany table, contact shadow & glowing candle
      drawCaptureSceneBackground(capCtx);

      // Layer 2: Raw horizontally mirrored camera frame clipped cleanly to the inner oval
      var ox = CX - INNER_RX;
      var oy = CY - INNER_RY;
      var ow = INNER_RX * 2;
      var oh = INNER_RY * 2;

      var targetAr = ow / oh;
      var cropW = Math.min(vw, vh * targetAr);
      var cropH = cropW / targetAr;
      var srcX = (vw - cropW) / 2;
      var srcY = (vh - cropH) / 2;

      capCtx.save();
      capCtx.beginPath();
      capCtx.ellipse(CX, CY, INNER_RX + 1, INNER_RY + 1, 0, 0, Math.PI * 2);
      capCtx.clip();
      capCtx.translate(ox + ow, oy);

      capCtx.drawImage(video, srcX, srcY, cropW, cropH, 0, 0, ow, oh);

      capCtx.save();
      capCtx.beginPath();
      capCtx.ellipse(CX, CY, INNER_RX, INNER_RY, 0, 0, Math.PI * 2);
      capCtx.clip();
      capCtx.translate(CX, CY);
      capCtx.scale(1, INNER_RY / INNER_RX);
      var rimShadow = capCtx.createRadialGradient(0, 0, INNER_RX * 0.88, 0, 0, INNER_RX);
      rimShadow.addColorStop(0, 'rgba(0, 0, 0, 0)');
      rimShadow.addColorStop(0.68, 'rgba(18, 10, 3, 0.22)');
      rimShadow.addColorStop(1, 'rgba(10, 5, 1, 0.72)');
      capCtx.fillStyle = rimShadow;
      capCtx.beginPath();

      capCtx.drawImage(frameCanvas, 0, 0);

      captureCanvas.toBlob(function (blob) {

        } finally {

        }
      }, 'image/jpeg', 0.95);
    } catch (err) {
      isSnapping = false;
    }
  }
